name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-server:
    name: Server lint (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/admin/backend/go.mod
          cache-dependency-path: services/admin/backend/go.sum

      - name: Run golangci-lint
        run: make lint

  test-server:
    name: Server tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/admin/backend/go.mod
          cache-dependency-path: services/admin/backend/go.sum

      # testcontainers-go uses the Docker daemon to boot postgres:16-alpine on
      # demand. The ubuntu-latest runner ships with Docker preinstalled and
      # running, so no extra setup is needed beyond confirming it's reachable.
      - name: Verify Docker is available
        run: docker info

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out ./internal/...
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 80) { print "Coverage " c "% is below the 80% threshold"; exit 1 } }'

  lint-operational-backend:
    name: Operational backend lint (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/operational/backend/go.mod
          cache-dependency-path: services/operational/backend/go.sum

      - name: Run golangci-lint
        run: make lint

  test-operational-backend:
    name: Operational backend tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/operational/backend/go.mod
          cache-dependency-path: services/operational/backend/go.sum

      # testcontainers-go is wired up via internal/testdb (mirrors admin's
      # harness); v1 has no tests that actually open a DB, but `go test` still
      # builds the package, which requires the lib/pq and testcontainers
      # imports to resolve. Docker is preinstalled on ubuntu-latest.
      - name: Verify Docker is available
        run: docker info

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out ./internal/...
          # internal/testdb is test-only scaffolding — never linked into the
          # production binary and (until operational grows DB-backed tests) has
          # no callers, so it sits at 0% and would otherwise drag the gated
          # total below the threshold. Exclude it, mirroring the Makefile's
          # business-coverage report.
          grep -v 'charity-chest/services/operational/backend/internal/testdb/' coverage.out > coverage.business.out
          COVERAGE=$(go tool cover -func=coverage.business.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage (excluding test scaffolding): ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 80) { print "Coverage " c "% is below the 80% threshold"; exit 1 } }'

  lint-operational-app:
    name: Operational app type-check (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational/app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # No `cache: npm` / cache-dependency-path until a package-lock.json
          # is committed (Expo SDK 52 install hasn't been run yet). Switch to
          # `npm ci` + cache once the lockfile lands.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run lint

  test-operational-app:
    name: Operational app tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational/app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # `test:ci` runs jest with --coverage and the thresholds configured in
      # jest.config.js (80% lines/functions/statements, 70% branches). Jest
      # exits non-zero when a threshold is missed, failing the job.
      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-app-coverage
          path: services/operational/app/coverage
          if-no-files-found: ignore
          retention-days: 7

  lint-webapp:
    name: Webapp lint (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/admin/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-webapp:
    name: Webapp tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/admin/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage
